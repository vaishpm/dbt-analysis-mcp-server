[project]
name = "dbt-analysis-mcp-server"
version = "0.1.0"
description = "Custom HTTP MCP server exposing safe dbt analysis tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.7.0",
]

[project.scripts]
dbt-analysis-mcp = "dbt_analysis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_analysis_mcp"]
