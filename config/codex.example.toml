# Codex CLI MCP Configuration
# Place (or merge) this in: ~/.codex/config.toml
#
# Prerequisites:
#   - Install Codex CLI: npm install -g @openai/codex
#   - Log in: codex login
#   - Install Node.js (for the Redash MCP stdio process)
#   - Set the environment variables below before starting codex
#
# No local dbt install, profiles.yml, or warehouse credentials needed.
# All dbt access is handled by the remote dbt Cloud MCP endpoint.

# ── dbt Cloud (remote HTTP MCP) ──────────────────────────────────────────────
# Gives Codex access to your dbt models, metrics, lineage, and SQL generation.
# Users do not need local dbt credentials; auth is handled via the token below.
[mcp_servers.dbt]
url = "https://jg844.eu1.dbt.com/api/ai/v1/mcp/"
enabled = true
tool_timeout_sec = 60

[mcp_servers.dbt.http_headers]
"x-dbt-prod-environment-id" = "15703"

[mcp_servers.dbt.http_headers_env_vars]
"Authorization" = "DBT_AUTH_HEADER"               # export DBT_AUTH_HEADER="token <your-personal-access-token>"

# ── Redash (local stdio MCP) ──────────────────────────────────────────────────
# Gives Codex access to Redash queries, dashboards, and visualizations.
[mcp_servers.redash]
command = "npx"
args = ["-y", "@suthio/redash-mcp"]
enabled = true

[mcp_servers.redash.env]
REDASH_URL = "https://redash.visable.com/"
REDASH_API_KEY = "${REDASH_API_KEY}"      # export REDASH_API_KEY=<your-api-key>
